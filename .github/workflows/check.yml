name: Check
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check on Linux
        if: runner.os == 'Linux'
        run: bash scripts/check.sh
      - name: Check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1
